[package]
name = "iris"
version = "0.2.0"
edition = "2021"
authors = ["Harsh Patel"]
description = "iris v0.2"

[[bin]]
name = "iris"
path = "src/main.rs"

[dependencies]
clap      = { version = "=4.4.18", features = ["derive"] }
zstd      = "=0.13.0"
