[package]
name = "iris"
version = "0.1.0"
edition = "2021"
authors = ["Harsh Patel"]
description = "GPU-accelerated compression using NVENC + VisionSort"
license = "MIT"

[[bin]]
name = "iris"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
zstd = "0.13"
byteorder = "1"
anyhow = "1"
indicatif = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
